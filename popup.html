<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tab Cycler</title>
<style>
  :root { --bg:#ffffff; --fg:#1b1f24; --muted:#6b7280; --line:#e5e7eb; --card:#f6f7f9; --accent:#2563eb; --ok:#15803d; --warn:#b45309; --danger:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1f24; --fg:#e8eaed; --muted:#9aa0a6; --line:#33373d; --card:#262a30; --accent:#6ea0ff; --ok:#4ade80; --warn:#fbbf24; --danger:#f87171; }
  }
  * { box-sizing: border-box; }
  body { width: 440px; margin: 0; padding: 12px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  header strong { font-size: 15px; }
  #status { color: var(--accent); font-weight: 600; text-align: right; }
  #note { color: var(--warn); min-height: 0; margin-top: 2px; font-size: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
  .ctl { display:flex; gap:6px; margin-top: 10px; }
  button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ctl button { flex: 1; }
  .row { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px; margin-bottom: 6px; }
  .row.current { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
  .row.dead { opacity: .6; }
  .top, .bot { display:flex; align-items:center; gap:6px; }
  .bot { margin-top: 6px; flex-wrap: wrap; }
  .idx { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color:#fff; display:grid; place-items:center; font-size: 11px; flex: none; }
  .ttl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .ic { padding: 2px 7px; }
  .num { width: 52px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  select { padding: 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; }
  .sm { padding: 3px 8px; }
  .hint { color: var(--muted); font-size: 12px; }
  label { display:inline-flex; align-items:center; gap:4px; }
  .opts { display:flex; gap:14px; margin-top: 8px; flex-wrap: wrap; }
  #total { color: var(--muted); margin-top: 6px; font-size: 12px; }
  .empty { color: var(--muted); margin: 4px 0; }
  .avail { display:flex; align-items:center; gap:6px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  #msg { color: var(--danger); margin-top: 8px; }
  .foot { color: var(--muted); font-size: 11px; margin-top: 10px; }
</style>
</head>
<body>
  <header><strong>Tab Cycler</strong><span id="status"></span></header>
  <div id="note"></div>

  <div class="ctl">
    <button id="prev" title="Bước trước">⏮</button>
    <button id="start" class="primary">Bắt đầu</button>
    <button id="pause">Tạm dừng</button>
    <button id="stop">Dừng</button>
    <button id="next" title="Bước kế">⏭</button>
  </div>

  <h2>Chuỗi chạy</h2>
  <div id="seq"></div>
  <div class="opts">
    <label><input type="checkbox" id="loop"> Lặp lại vòng</label>
    <label><input type="checkbox" id="autoPause"> Tự tạm dừng khi tôi đổi tab</label>
  </div>
  <div id="total"></div>

  <h2>Tab đang mở</h2>
  <div id="avail"></div>
  <div id="msg"></div>
  <div class="foot">Phím tắt: Alt+Shift+P bắt đầu/tạm dừng · Alt+Shift+X dừng hẳn</div>
  <script src="popup.js"></script>
</body>
</html>
